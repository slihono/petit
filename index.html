<!DOCTYPE html>
<html lang="en, fr, viet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 For You, the Girl I love 💕</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(180deg,#ffd6e7 0%,#ffb3d1 30%,#ff85b3 60%,#e8608a 100%);
    min-height:100vh; overflow:hidden; font-family:'Georgia',serif;
  }
  #scene { position:relative; width:100%; height:100vh; overflow:hidden; }

  /* CLOUDS */
  .cloud { position:absolute; background:rgba(255,255,255,0.6); border-radius:50px; animation:floatCloud linear infinite; }
  .cloud::before,.cloud::after { content:''; position:absolute; background:rgba(255,255,255,0.6); border-radius:50%; }
  .cloud::before { width:60%; height:180%; top:-50%; left:15%; }
  .cloud::after  { width:45%; height:140%; top:-30%; right:15%; }
  @keyframes floatCloud { from{transform:translateX(-200px)} to{transform:translateX(110vw)} }

  /* HEARTS */
  .heart { position:absolute; top:-40px; animation:fallHeart linear infinite; opacity:0.7; }
  @keyframes fallHeart { 0%{transform:translateY(0) rotate(0deg);opacity:0.8} 100%{transform:translateY(110vh) rotate(360deg);opacity:0} }

  /* SPARKLES */
  .sparkle { position:absolute; background:#fff; border-radius:50%; animation:sparkleAnim ease-in-out infinite; }
  @keyframes sparkleAnim { 0%,100%{transform:scale(0);opacity:0} 50%{transform:scale(1);opacity:1} }

  /* GROUND */
  #ground { position:absolute; bottom:0; width:100%; height:22%;
    background:linear-gradient(180deg,#a8e063 0%,#56ab2f 100%);
    border-radius:60% 60% 0 0 / 30% 30% 0 0; }

  /* TULIPS */
  .tulip { position:absolute; bottom:18%; display:flex; flex-direction:column; align-items:center;
    animation:sway ease-in-out infinite; transform-origin:bottom center; }
  @keyframes sway { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }

  /* TITLE */
  #title { position:absolute; top:5%; width:100%; text-align:center; color:#fff;
    text-shadow:0 2px 12px rgba(180,0,80,0.4); animation:titleFloat ease-in-out 3s infinite; z-index:50; }
  #title h1 { font-size:clamp(22px,5vw,42px); letter-spacing:2px; }
  #title p  { font-size:clamp(12px,2.5vw,20px); margin-top:6px; opacity:0.9; }
  @keyframes titleFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* ANIMALS */
  .animal-container { position:absolute; bottom:19%; display:flex; flex-direction:column;
    align-items:center; animation:bounce ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .animal-label { font-size:11px; color:#fff; font-family:Georgia; margin-top:4px;
    text-shadow:0 1px 4px rgba(0,0,0,0.3); white-space:nowrap; }
  svg.animal { overflow:visible; }

  /* GOOSE — controlled entirely by JS requestAnimationFrame */
  #goose { position:absolute; }
  .wing-top { transform-origin:28px 22px; animation:flapWing ease-in-out 0.38s infinite alternate; }
  .wing-bot { transform-origin:28px 32px; animation:flapWingBot ease-in-out 0.38s infinite alternate; }
  @keyframes flapWing    { from{transform:rotate(-35deg)} to{transform:rotate(25deg)} }
  @keyframes flapWingBot { from{transform:rotate(10deg)}  to{transform:rotate(-20deg)} }

  /* RAINBOW */
  #rainbow { position:absolute; top:10%; left:50%; transform:translateX(-50%); opacity:0.35; }

  /* MUSIC BTN */
  #music-btn { position:fixed; top:14px; right:14px;
    background:rgba(255,255,255,0.3); border:2px solid rgba(255,255,255,0.7);
    border-radius:50%; width:50px; height:50px; font-size:22px; cursor:pointer;
    z-index:999; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
  #music-btn:hover { background:rgba(255,255,255,0.5); }

  /* LYRICS TICKER */
  #lyrics-bar {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(255, 20, 147, 0.55);
    backdrop-filter:blur(6px);
    border-top:2px solid rgba(255,255,255,0.5);
    padding:10px 0;
    z-index:100;
    overflow:hidden;
    height:44px;
  }
  #lyrics-track {
    display:inline-block;
    white-space:nowrap;
    font-size:18px;
    color:#fff;
    text-shadow:0 1px 6px rgba(120,0,60,0.5);
    letter-spacing:1px;
    font-family:'Georgia',serif;
    animation:scrollLyrics linear infinite;
  }
  @keyframes scrollLyrics {
    0%   { transform:translateX(100vw); }
    100% { transform:translateX(-100%); }
  }
</style>
</head>

// GOOSE SMOOTH FLIGHT via requestAnimationFrame
const gooseEl = document.getElementById('goose');
const GOOSE_W = 110;
let gooseX = -GOOSE_W;
let gooseDir = 1; // 1=right, -1=left
const GOOSE_SPEED = 0.5; // px per frame

function animateGoose(){
  gooseX += GOOSE_SPEED * gooseDir;
  const vw = window.innerWidth;
  if(gooseDir === 1 && gooseX > vw + 20){
    gooseDir = -1;
    gooseX = vw + 20;
  } else if(gooseDir === -1 && gooseX < -GOOSE_W - 20){
    gooseDir = 1;
    gooseX = -GOOSE_W - 20;
  }
  gooseEl.style.left = gooseX + 'px';
  // flip horizontally based on direction
  gooseEl.style.transform = gooseDir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
  requestAnimationFrame(animateGoose);
}
animateGoose();

const lyricsTrack = document.getElementById('lyrics-track');

// Compute animation duration based on text length (approx 80px/s)
function setLyricsDuration(){
  const textWidth = lyricsTrack.scrollWidth;
  const vw = window.innerWidth;
  const duration = (textWidth + vw) / 80;
  lyricsTrack.style.animationDuration = duration + 's';
}
setLyricsDuration();
window.addEventListener('resize', setLyricsDuration);

let playing = false;

function startMusic(){
  song.play();

function stopMusic(){
  song.pause();

  document.getElementById('music-btn').textContent = '🎵';
}

document.getElementById('music-btn').addEventListener('click', ()=>{
  if (playing) stopMusic();
  else startMusic();
});
</script>
</body>
</html>
